name: Update concerts

on:
  schedule:
    # 每天两次：UTC 11:17 / 23:17（纳什维尔约早 5–6 点、晚 5–6 点）
    - cron: "17 11,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md", "tests/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-concerts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch events from Ticketmaster
        id: fetch
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python3 scripts/fetch_events.py

      - name: Open an issue for new shows by watched artists
        if: steps.fetch.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat build/notify_title.txt)" --body-file build/notify.md

      - name: Commit updated data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: update concerts $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          rm -f _site/data/state.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
